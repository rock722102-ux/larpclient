name: Build LarpClient

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Display system info
      run: |
        echo "=== Java Version ==="
        java -version
        echo ""
        echo "=== Gradle Version ==="
        ./gradlew --version
    
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test --no-daemon --info
    
    - name: Check build output
      if: success()
      run: |
        echo "=== Built JARs ==="
        ls -lah build/libs/ || echo "No libs directory found"
        find build -name "*.jar" -type f || echo "No JAR files found"
    
    - name: Upload JAR artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: larpclient-build
        path: build/libs/*.jar
        retention-days: 30
    
    - name: Build failed - show gradle cache
      if: failure()
      run: |
        echo "=== Gradle cache dir ==="
        ls -la ~/.gradle/caches/ || echo "No gradle cache"
        echo ""
        echo "=== Current directory ==="
        pwd
        ls -la
